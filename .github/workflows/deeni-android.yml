name: Build Deeni Android AAB

on:
  workflow_dispatch:
  push:
    paths:
      - "deeni-android/**"
      - ".github/workflows/deeni-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run unit tests
        working-directory: deeni-android
        run: gradle --no-daemon testDebugUnitTest
      - name: Build release Android App Bundle
        working-directory: deeni-android
        run: gradle --no-daemon bundleRelease
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Deeni-release-aab
          path: deeni-android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
