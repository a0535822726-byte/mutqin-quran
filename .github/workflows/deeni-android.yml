name: Build Deeni Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "deeni-android/**"
      - ".github/workflows/deeni-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run unit tests
        working-directory: deeni-android
        run: gradle --no-daemon testDebugUnitTest
      - name: Build debug APK
        working-directory: deeni-android
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Deeni-debug-apk
          path: deeni-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
